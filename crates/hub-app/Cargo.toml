[package]
name = "hub-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "controlanything"
path = "src/main.rs"

[dependencies]
hub-core.workspace = true
hub-ui.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# Executable icon (Windows resource #1, also used by GPUI for the window).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
