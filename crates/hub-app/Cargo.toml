[package]
name = "hub-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "controlanything"
path = "src/main.rs"

[dependencies]
hub-core.workspace = true
hub-ui.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# Icône de l'exécutable (ressource Windows n° 1, reprise aussi par GPUI pour la fenêtre).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
