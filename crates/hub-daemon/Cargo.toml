[package]
name = "hub-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "controlanythingd"
path = "src/main.rs"

[dependencies]
hub-core.workspace = true
hub-rgb.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true
nvml-wrapper.workspace = true

[target.'cfg(windows)'.dependencies]
hub-backend-windows.workspace = true
# DACL du named pipe (SDDL -> descripteur de sécurité)
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
# Service Windows (SCM) et logs fichiers en mode service
windows-service = "0.8.1"
tracing-appender = "0.2.5"

[target.'cfg(target_os = "linux")'.dependencies]
hub-backend-linux.workspace = true
