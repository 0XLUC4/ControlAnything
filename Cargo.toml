# File: Cargo.toml
# Why: centralized versions, checked on crates.io on 2026-11-08
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
# UI: gpui-kit (formerly gpui-component) re-exports gpui-pre =0.3.11 (snapshot zed@f816e1f).
# DO NOT add gpui 0.2.2 from crates.io or zed from git: two incompatible GPUIs.
gpui-kit = "=0.9.0"

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
async-channel = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sysinfo = "0.40"
nvml-wrapper = "0.13"
windows = "0.62"

hub-core = { path = "crates/hub-core" }
hub-backend-windows = { path = "crates/hub-backend-windows" }
hub-backend-linux = { path = "crates/hub-backend-linux" }
hub-ui = { path = "crates/hub-ui" }
hub-rgb = { path = "crates/hub-rgb" }

[profile.release]
lto = "thin"
codegen-units = 1
# panic stays "unwind": with "abort", the Drop impls that hand fans back to auto would not run
