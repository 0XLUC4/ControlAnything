# ControlAnything: profiles for MSI Z790 Gaming Plus WiFi + i9-14900K + AIO + RTX 5080
# Import: Settings > Import. Replaces the whole config (profiles + fan names).
#
# Avoiding "ramps to full speed then drops back":
# - the radiator and the pump follow the CPU only, case fans follow max(CPU, GPU);
# - same curve + smoothing as the editor's Presets buttons;
# - 4-6 °C hysteresis: short 14900K spikes are ignored;
# - 2-3 s response time + small step-up: smooth ramp instead of jumps;
# - CPU failsafe 98 °C (TjMax 100 °C): a 14900K goes above 90 °C under normal load.
# Empty headers (SYS_FAN2/4/5/6) and GPU fans: not listed = Auto (BIOS / NVIDIA driver, zero RPM at idle).

poll_interval_ms = 1000
active_profile = "Silent"

[fan_labels]
"nct6687/pwm1" = "AIO radiator (CPU_FAN)"
"nct6687/pwm2" = "AIO pump"
"nct6687/pwm3" = "Antec (SYS_FAN1)"
"nct6687/pwm5" = "Antec (SYS_FAN3)"

[failsafe]
cpu_critical = 98.0
gpu_critical = 85.0

# ------------- Silent: office work, light gaming -------------
[[profiles]]
name = "Silent"

[profiles.fans."nct6687/pwm1"]
min_duty = 25
hysteresis = 6.0
step_up = 3
step_down = 2
response_ms = 3000
mode = { mode = "curve", source = { type = "sensor", id = "cpu/package_temp" }, points = [
    { temp = 45.0, duty = 25 },
    { temp = 65.0, duty = 32 },
    { temp = 78.0, duty = 48 },
    { temp = 88.0, duty = 70 },
    { temp = 95.0, duty = 100 },
] }

# Pump: fixed speed = constant noise; 60 % = daemon safety floor (FanControl: 40-50 % at idle).
[profiles.fans."nct6687/pwm2"]
mode = { mode = "fixed", duty = 60 }

[profiles.fans."nct6687/pwm3"]
min_duty = 25
hysteresis = 6.0
step_up = 3
step_down = 2
response_ms = 3000
mode = { mode = "curve", source = { type = "max", ids = ["cpu/package_temp", "gpu0/temp"] }, points = [
    { temp = 45.0, duty = 25 },
    { temp = 65.0, duty = 32 },
    { temp = 78.0, duty = 48 },
    { temp = 88.0, duty = 70 },
    { temp = 95.0, duty = 100 },
] }

[profiles.fans."nct6687/pwm5"]
min_duty = 25
hysteresis = 6.0
step_up = 3
step_down = 2
response_ms = 3000
mode = { mode = "curve", source = { type = "max", ids = ["cpu/package_temp", "gpu0/temp"] }, points = [
    { temp = 45.0, duty = 25 },
    { temp = 65.0, duty = 32 },
    { temp = 78.0, duty = 48 },
    { temp = 88.0, duty = 70 },
    { temp = 95.0, duty = 100 },
] }

