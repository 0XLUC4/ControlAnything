# cargo-packager 0.11 config (Windows NSIS). Paths are relative to this folder.
# Build: packaging\build-windows.ps1  (or: cargo packager --release -c packaging\Packager.toml -f nsis)
name = "controlanything" # required: without it 0.11.8 fails with os error 267 (runs cargo in the file path)
product-name = "ControlAnything"
version = "0.4.2" # keep in sync with [workspace.package] version in Cargo.toml
identifier = "eu.controlanything.hub"
publisher = "ControlAnything"
description = "PC control: sensors, fans, RGB"
out-dir = "../target/packager"
binaries-dir = "../target/release"
formats = ["nsis"]
icons = ["../assets/icons/controlanything.ico"]
binaries = [
  { path = "controlanything", main = true },
  { path = "controlanythingd", main = false },
]
resources = [
  "../assets/pawnio", # -> $INSTDIR\pawnio\*.bin + README.md (LGPL notice)
  "../README.md",
]

[nsis]
installMode = "perMachine" # no "install-mode" alias in 0.11.8
installer-icon = "../assets/icons/controlanything.ico"
template = "windows/installer.nsi"
